<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Poppins:wght@400;600&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">
                <img class="star" src="/static/img/star.png" alt="Star icon">
                <span class="brand-text">{{ name }}</span>
            </a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="projects" id="projects">
            <div class="container">
                <p class="section-kicker">projects</p>
                <h1>Projects</h1>

                <div class="projects-grid">
                    {% for project in project_list %}
                        <div class="project-card">
                            <div class="project-thumb">
                                <img src="{{ project.thumbnail }}" alt="Photo of {{ project.name }}">
                            </div>
                            <div class="project-details">
                                <div>
                                    <h3 class="project-name">{{ project.name }}</h3>
                                    <p class="project-desc">{{ project.description }}</p>
                                </div>
                                <a href="{{ project.link }}" class="project-btn">See Details →</a>
                            </div>
                        </div>
                    {% empty %}
                        <p class="empty-state">Belum ada proyek yang ditambahkan.</p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
